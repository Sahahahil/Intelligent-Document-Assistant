<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intelligent Document Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f3;--panel:#fbfcfc;--ink:#14232b;--mute:#5d6e76;--line:#d5dee1;--acc:#1d6b75;--acc-ink:#fff;--soft:#dcebed;--hi:#f0b429;--hi-soft:#fbefcf;--ok:#2f7d4f;--warn:#a8630a;--danger:#b3412f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1f;--panel:#16252b;--ink:#e6eef0;--mute:#8fa3ab;--line:#2a3d45;--acc:#58b6c2;--acc-ink:#08242a;--soft:#1d3840;--hi:#f0b429;--hi-soft:#3a3016;--ok:#6cc58d;--warn:#e5a24a;--danger:#ef8a77;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a1f;--panel:#16252b;--ink:#e6eef0;--mute:#8fa3ab;--line:#2a3d45;--acc:#58b6c2;--acc-ink:#08242a;--soft:#1d3840;--hi:#f0b429;--hi-soft:#3a3016;--ok:#6cc58d;--warn:#e5a24a;--danger:#ef8a77;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Hanken Grotesk",system-ui,sans-serif}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
nav{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.brand{font-family:Newsreader,serif;font-size:19px;font-weight:600;line-height:1.15;padding:4px 10px 18px}
.brand small{display:block;font:500 12px "Hanken Grotesk";color:var(--mute);margin-top:4px}
.tab{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;color:var(--mute);font-weight:500}
.tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.tab:hover{background:var(--bg)}
.tab[aria-selected=true]{background:var(--soft);color:var(--ink)}
.sp{flex:1}
.user{font-size:13px;color:var(--mute);padding:8px 10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.ghost{border:1px solid var(--line);background:none;border-radius:8px;padding:5px 10px;font-size:13px}
main{min-width:0;height:100%;overflow:hidden}
section{display:none;height:100%}
section.on{display:flex}
.pad{padding:28px 32px;overflow:auto;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.head h2{font-size:28px}.head p{margin:4px 0 0;color:var(--mute)}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:none;color:var(--ink);border:1px solid var(--line)}
/* chat */
.sessions{width:230px;border-right:1px solid var(--line);padding:16px 10px;overflow:auto;flex:none;background:var(--panel)}
.sessions button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sessions button.cur{background:var(--soft);color:var(--ink)}
.sessions .new{margin-bottom:10px;width:100%;text-align:center;border:1px dashed var(--line);color:var(--ink)}
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
.log{flex:1;overflow:auto;padding:28px 32px}
.col{max-width:720px;margin:0 auto}
.msg{margin-bottom:22px}
.msg.u{display:flex;justify-content:flex-end}
.msg.u .b{background:var(--acc);color:var(--acc-ink);padding:10px 14px;border-radius:14px 14px 3px 14px;max-width:80%}
.msg.a .b{font-size:16px;line-height:1.65}
.msg.a .b p{margin:0 0 10px}
.cite{display:inline-block;background:var(--hi-soft);color:var(--ink);border:1px solid var(--hi);border-radius:5px;font-size:11px;font-weight:600;padding:0 5px;margin:0 2px;vertical-align:1px}
.srcs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.src{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--mute);max-width:260px}
.src b{color:var(--ink);display:block;font-weight:600}
.caret{display:inline-block;width:7px;height:1em;background:var(--acc);vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.empty{text-align:center;padding:9vh 0 0}
.empty h2{font-size:32px;margin-bottom:8px}
.empty p{color:var(--mute);margin:0 0 22px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:14px}
.chips button:hover{border-color:var(--acc)}
.compose{padding:14px 32px 22px}
.compose .col{display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px}
.compose textarea{flex:1;border:0;background:none;resize:none;font:inherit;color:inherit;max-height:140px;padding:6px 0;outline:0}
/* docs */
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:30px;text-align:center;background:var(--panel);margin-bottom:22px;color:var(--mute)}
.drop.over{border-color:var(--acc);background:var(--soft)}
.drop button{margin-top:10px}
.list{display:grid;gap:10px}
.doc{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.doc b{font-weight:600}.doc small{color:var(--mute)}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;justify-self:end}
.pill.ready{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.busy{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.bar{grid-column:1/-1;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.del{border:0;background:none;color:var(--danger);font-size:13px;justify-self:end}
/* booking */
.book{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.steps span{font-size:13px;color:var(--mute);padding:4px 12px;border-radius:999px;border:1px solid var(--line)}
.steps span.on{background:var(--soft);color:var(--ink);border-color:var(--acc);font-weight:600}
.steps span.done{color:var(--ok)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:12px;color:var(--mute);padding:4px 0}
.cal button{aspect-ratio:1;border:0;background:none;border-radius:8px;font-size:14px}
.cal button:hover:not(:disabled){background:var(--soft)}
.cal button:disabled{color:var(--line);cursor:default}
.cal button.sel{background:var(--acc);color:var(--acc-ink);font-weight:600}
.cal button.today{box-shadow:inset 0 0 0 1px var(--acc)}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calh h3{font-size:20px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.slots button{border:1px solid var(--line);background:none;border-radius:8px;padding:9px}
.slots button.sel{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.slots button:disabled{opacity:.4;text-decoration:line-through;cursor:default}
.field{display:grid;gap:4px;margin-bottom:12px;font-size:14px;color:var(--mute)}
.field input,.field select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.row{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.bk{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.bk:last-child{border:0}.bk small{color:var(--mute);display:block}
.ok{color:var(--ok);font-weight:600}
@media (max-width:820px){
 .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
 nav{order:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px;justify-content:space-around}
 .brand,.sp,.user{display:none}
 .tab{flex-direction:column;gap:2px;font-size:12px;padding:6px 14px}
 .sessions{display:none}.pad,.log{padding:20px 16px}.compose{padding:10px 16px 16px}
 .book{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<nav role="tablist" aria-label="Sections">
 <div class="brand">Document Assistant<small>Ask your files. Book the interview.</small></div>
 <button class="tab" role="tab" data-t="chat" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Chat</button>
 <button class="tab" role="tab" data-t="docs" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6zM14 3v5h5"/></svg>Documents</button>
 <button class="tab" role="tab" data-t="book" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M8 3v5M16 3v5"/></svg>Bookings</button>
 <div class="sp"></div>
 <div class="user"><span>Demo user</span><button class="ghost" id="theme" aria-label="Toggle theme">Theme</button></div>
</nav>
<main>
<section id="chat" class="on">
 <aside class="sessions" id="sessions"></aside>
 <div class="chat">
  <div class="log" id="log"><div class="col" id="thread"></div></div>
  <div class="compose"><div class="col">
   <textarea id="q" rows="1" placeholder="Ask about your documents" aria-label="Message"></textarea>
   <button class="btn" id="send">Send</button>
  </div></div>
 </div>
</section>
<section id="docs"><div class="pad"><div style="max-width:820px;margin:0 auto">
 <div class="head"><div><h2>Documents</h2><p>Files are split into chunks and embedded so chat can cite them.</p></div></div>
 <div class="drop" id="drop">Drop PDF or TXT files here<br><button class="btn sec" id="pick">Choose files</button><input type="file" id="file" accept=".pdf,.txt" multiple hidden></div>
 <div class="list" id="docList"></div>
</div></div></section>
<section id="book"><div class="pad"><div style="max-width:900px;margin:0 auto">
 <div class="head"><div><h2>Interview bookings</h2><p>Pick a date, a time and tell us who’s joining.</p></div></div>
 <div class="book">
  <div class="card" id="wiz"></div>
  <div class="card"><h3 style="font-size:19px;margin-bottom:6px">Upcoming</h3><div id="bks"></div></div>
 </div>
</div></div></section>
</main>
</div>
<script>
const $=s=>document.querySelector(s), esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
/* tabs */
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));
 document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
});
$('#theme').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme==='dark';r.dataset.theme=d?'light':'dark'};

/* documents (mock state) */
let docs=[
 {id:1,name:'Candidate-handbook.pdf',size:'1.2 MB',chunks:48,p:100},
 {id:2,name:'Interview-process.txt',size:'14 KB',chunks:6,p:100}
];
function renderDocs(){
 $('#docList').innerHTML=docs.length?docs.map(d=>`<div class="doc"><div><b>${esc(d.name)}</b><br><small>${d.size}${d.p===100?' · '+d.chunks+' chunks':''}</small></div>
 <span class="pill ${d.p===100?'ready':'busy'}">${d.p===100?'Ready':d.p<40?'Extracting text':d.p<75?'Chunking':'Embedding'}</span>
 ${d.p<100?`<div class="bar"><i style="width:${d.p}%"></i></div>`:`<span></span><button class="del" data-id="${d.id}">Delete</button>`}</div>`).join(''):'<p style="color:var(--mute)">No documents yet. Upload one to start asking questions.</p>';
 document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{docs=docs.filter(d=>d.id!=b.dataset.id);renderDocs()});
}
function addFiles(fl){[...fl].forEach(f=>{
 const d={id:Date.now()+Math.random(),name:f.name,size:f.size>1e6?(f.size/1e6).toFixed(1)+' MB':Math.max(1,Math.round(f.size/1e3))+' KB',chunks:Math.max(2,Math.round(f.size/2500)),p:5};
 docs.unshift(d);renderDocs();
 const t=setInterval(()=>{d.p=Math.min(100,d.p+12+Math.random()*10);renderDocs();if(d.p>=100)clearInterval(t)},450);
})}
$('#pick').onclick=()=>$('#file').click();$('#file').onchange=e=>addFiles(e.target.files);
const dz=$('#drop');
['dragover','dragenter'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>addFiles(e.dataTransfer.files));
renderDocs();

/* chat (simulated streaming) */
let sessions=[{id:1,title:'New conversation',msgs:[]}],cur=sessions[0],busy=false;
function renderSessions(){
 $('#sessions').innerHTML='<button class="new" id="nw">New chat</button>'+sessions.map(s=>`<button data-id="${s.id}" class="${s===cur?'cur':''}">${esc(s.title)}</button>`).join('');
 $('#nw').onclick=()=>{if(busy)return;cur={id:Date.now(),title:'New conversation',msgs:[]};sessions.unshift(cur);renderSessions();renderThread()};
 document.querySelectorAll('.sessions [data-id]').forEach(b=>b.onclick=()=>{if(busy)return;cur=sessions.find(s=>s.id==b.dataset.id);renderSessions();renderThread()});
}
function msgHTML(m){
 if(m.r==='u')return `<div class="msg u"><div class="b">${esc(m.t)}</div></div>`;
 const body=esc(m.t).split('\n\n').map(p=>`<p>${p.replace(/\[(\d)\]/g,'<span class="cite">$1</span>')}</p>`).join('');
 const src=m.s?`<div class="srcs">${m.s.map((s,i)=>`<div class="src"><b>${i+1} · ${esc(s[0])}</b>${esc(s[1])}</div>`).join('')}</div>`:'';
 return `<div class="msg a"><div class="b">${body}${m.live?'<span class="caret"></span>':''}</div>${src}</div>`;
}
function renderThread(){
 const t=$('#thread');
 if(!cur.msgs.length){t.innerHTML=`<div class="empty"><h2>What would you like to know?</h2><p>Answers come from your uploaded documents, with sources.</p><div class="chips">${['Summarise the interview process','What does the handbook say about remote work?','How long are interviews?'].map(x=>`<button>${x}</button>`).join('')}</div></div>`;
  t.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>ask(b.textContent));return}
 t.innerHTML=cur.msgs.map(msgHTML).join('');$('#log').scrollTop=1e9;
}
const answers=[
 ['Interviews follow three stages: a 30-minute screening call, a technical conversation of about 60 minutes, and a final meeting with the team [1]. Candidates receive the schedule at least two days ahead [2].\n\nYou can book a slot from the Bookings tab.',[['Interview-process.txt','Section 2 · Stages and timing'],['Candidate-handbook.pdf','Page 7 · Scheduling']]],
 ['The handbook describes a hybrid model: three days in the office and two remote, with exceptions agreed with a manager [1].\n\nNothing in the uploaded files covers relocation support.',[['Candidate-handbook.pdf','Page 12 · Working arrangements']]]
];
async function ask(text){
 text=text.trim();if(!text||busy)return;busy=true;$('#send').disabled=true;$('#q').value='';
 if(!cur.msgs.length)cur.title=text.slice(0,40);
 cur.msgs.push({r:'u',t:text});
 if(!docs.some(d=>d.p===100)){cur.msgs.push({r:'a',t:'There are no processed documents yet. Upload a PDF or TXT file in Documents, then ask again.'});busy=false;$('#send').disabled=false;renderSessions();renderThread();return}
 const a=answers[cur.msgs.length%2],m={r:'a',t:'',live:true};cur.msgs.push(m);renderSessions();
 for(const w of a[0].split(/(?<= )/)){m.t+=w;renderThread();await new Promise(r=>setTimeout(r,28))}
 m.live=false;m.s=a[1];busy=false;$('#send').disabled=false;renderThread();
}
$('#send').onclick=()=>ask($('#q').value);
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(e.target.value)}});
renderSessions();renderThread();

/* bookings */
let bookings=[{n:'Priya Shah',d:'Dec 2, 2026',t:'10:00',k:'Technical'}];
let w={step:0,y:new Date().getFullYear(),m:new Date().getMonth(),date:null,time:null,name:'',email:'',kind:'Screening'};
const slots=['09:00','09:30','10:00','10:30','11:00','13:00','14:00','14:30','15:00','16:00'];
const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
function renderBks(){$('#bks').innerHTML=bookings.map(b=>`<div class="bk"><div><b>${esc(b.n)}</b><small>${b.k}</small></div><div style="text-align:right">${b.d}<small>${b.t}</small></div></div>`).join('')}
function renderWiz(){
 const S=['Date','Time','Details','Confirm'],el=$('#wiz');
 let h=`<div class="steps">${S.map((s,i)=>`<span class="${i===w.step?'on':i<w.step?'done':''}">${s}</span>`).join('')}</div>`;
 if(w.step===0){
  const first=new Date(w.y,w.m,1),days=new Date(w.y,w.m+1,0).getDate(),today=new Date();today.setHours(0,0,0,0);
  h+=`<div class="calh"><button class="ghost" id="pv" aria-label="Previous month">‹</button><h3>${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h3><button class="ghost" id="nx" aria-label="Next month">›</button></div><div class="cal">`+
  ['S','M','T','W','T','F','S'].map(d=>`<div class="dow">${d}</div>`).join('')+'<div></div>'.repeat(first.getDay());
  for(let d=1;d<=days;d++){const x=new Date(w.y,w.m,d),off=x<today||x.getDay()%6===0,sel=w.date&&+w.date===+x;
   h+=`<button ${off?'disabled':''} data-d="${d}" class="${sel?'sel':''} ${+x===+today?'today':''}">${d}</button>`}
  h+='</div>';
 }else if(w.step===1){
  h+=`<p style="margin:0 0 12px;color:var(--mute)">Available on ${fmt(w.date)}</p><div class="slots">${slots.map((s,i)=>`<button data-t="${s}" class="${w.time===s?'sel':''}" ${(w.date.getDate()+i)%4===0?'disabled':''}>${s}</button>`).join('')}</div>`;
 }else if(w.step===2){
  h+=`<label class="field">Full name<input id="nm" value="${esc(w.name)}" autocomplete="name"></label><label class="field">Email<input id="em" type="email" value="${esc(w.email)}" autocomplete="email"></label><label class="field">Interview type<select id="kd">${['Screening','Technical','Final'].map(k=>`<option ${k===w.kind?'selected':''}>${k}</option>`).join('')}</select></label>`;
 }else if(w.step===3){
  h+=`<h3 style="font-size:22px;margin-bottom:10px">Review your booking</h3><div class="bk"><span>Date</span><b>${fmt(w.date)}</b></div><div class="bk"><span>Time</span><b>${w.time}</b></div><div class="bk"><span>Name</span><b>${esc(w.name)}</b></div><div class="bk"><span>Email</span><b>${esc(w.email)}</b></div><div class="bk"><span>Type</span><b>${w.kind}</b></div>`;
 }else{
  h+=`<h3 style="font-size:22px">Booking confirmed</h3><p class="ok">${fmt(w.date)} at ${w.time}</p><p style="color:var(--mute)">A confirmation will go to ${esc(w.email)}.</p><button class="btn sec" id="again">Book another</button>`;
 }
 if(w.step<4)h+=`<div class="row"><button class="btn sec" id="bk" ${w.step?'':'style="visibility:hidden"'}>Back</button><button class="btn" id="nxt" ${(w.step===0&&!w.date)||(w.step===1&&!w.time)?'disabled':''}>${w.step===3?'Confirm booking':'Continue'}</button></div>`;
 el.innerHTML=h;
 const on=(s,f)=>{const e=el.querySelector(s);if(e)e.onclick=f};
 on('#pv',()=>{w.m--;if(w.m<0){w.m=11;w.y--}renderWiz()});on('#nx',()=>{w.m++;if(w.m>11){w.m=0;w.y++}renderWiz()});
 el.querySelectorAll('.cal [data-d]').forEach(b=>b.onclick=()=>{w.date=new Date(w.y,w.m,+b.dataset.d);w.time=null;renderWiz()});
 el.querySelectorAll('.slots [data-t]').forEach(b=>b.onclick=()=>{w.time=b.dataset.t;renderWiz()});
 on('#bk',()=>{save();w.step--;renderWiz()});
 on('#nxt',()=>{save();
  if(w.step===2&&(!w.name.trim()||!/^\S+@\S+\.\S+$/.test(w.email))){alert('Enter your name and a valid email address.');return}
  if(w.step===3)bookings.push({n:w.name,d:fmt(w.date),t:w.time,k:w.kind});
  w.step++;renderWiz();renderBks()});
 on('#again',()=>{w={...w,step:0,date:null,time:null,name:'',email:''};renderWiz()});
